<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CSV jadval</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef2f8; --panel:#ffffff; --ink:#14213d; --muted:#5b6785; --line:#d9e0ee;
  --accent:#2b50e6; --accent-ink:#ffffff; --hl:#ffe08a; --stripe:#f6f8fc; --sortbg:#e8edff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1526; --panel:#171f36; --ink:#e8ecf8; --muted:#97a3c4; --line:#2a3558;
    --accent:#7b95ff; --accent-ink:#0f1526; --hl:#6b5200; --stripe:#1b2440; --sortbg:#222d52;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1526; --panel:#171f36; --ink:#e8ecf8; --muted:#97a3c4; --line:#2a3558;
  --accent:#7b95ff; --accent-ink:#0f1526; --hl:#6b5200; --stripe:#1b2440; --sortbg:#222d52;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
.wrap{max-width:1040px;margin:0 auto;padding:28px 16px 48px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:22px}
h1{font-size:clamp(1.7rem,4vw,2.4rem);font-weight:800;letter-spacing:-.02em;margin:0 0 4px;line-height:1.1}
header p{margin:0;color:var(--muted);max-width:52ch}
.theme{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit;font-weight:600;cursor:pointer}
.grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:18px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.panel h2{font-size:1rem;margin:0 0 10px;font-weight:800}
textarea{width:100%;min-height:260px;resize:vertical;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:12px;font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;font-size:.9rem;line-height:1.6}
textarea:focus,input:focus,select:focus,button:focus-visible,th button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
button.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 14px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
button.btn:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.hint{color:var(--muted);font-size:.85rem;margin:10px 0 0}
.err{color:#c62828;font-weight:600;font-size:.9rem;margin:8px 0 0;min-height:1.2em}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .err{color:#ff8a80}}
:root[data-theme="dark"] .err{color:#ff8a80}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.tools label{display:flex;flex-direction:column;font-size:.8rem;color:var(--muted);font-weight:600;gap:4px;flex:1 1 140px}
input[type=search],select{border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:9px 10px;font:inherit;width:100%}
.stats{display:flex;flex-wrap:wrap;gap:14px;font-size:.9rem;color:var(--muted);margin-bottom:10px}
.stats b{color:var(--ink)}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:360px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:nth-child(even){background:var(--stripe)}
tbody tr:last-child td{border-bottom:0}
th{padding:0;background:var(--panel);position:sticky;top:0}
th button{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:10px 14px;cursor:pointer;font-weight:800}
th button:hover{background:var(--sortbg)}
th.sorted,td.sorted{background:var(--sortbg)}
td.num{font-variant-numeric:tabular-nums;font-weight:600}
th .arrow{color:var(--accent);font-size:.85rem;min-width:1em}
mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 1px}
.empty{padding:28px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.theme,.btn,th button{transition:background .15s,border-color .15s}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>CSV jadval</h1>
      <p>Vergul bilan ajratilgan matnni yopishtiring — u darhol jadvalga aylanadi. Nom bo'yicha qidiring, son bo'yicha saralang.</p>
    </div>
    <button class="theme" id="theme" type="button" aria-label="Mavzuni almashtirish">Tun / Kun</button>
  </header>

  <div class="grid">
    <section class="panel" aria-labelledby="t1">
      <h2 id="t1">1. CSV matni</h2>
      <textarea id="csv" spellcheck="false" aria-label="CSV matni">Nom,Toifa,Son
Olma,Meva,120
Anor,Meva,45
Sabzi,Sabzavot,300
Piyoz,Sabzavot,210
Behi,Meva,18
Pomidor,Sabzavot,95
Uzum,Meva,160</textarea>
      <div class="row">
        <button class="btn primary" id="go" type="button">Jadvalga aylantirish</button>
        <button class="btn" id="sample" type="button">Namuna</button>
        <button class="btn" id="clear" type="button">Tozalash</button>
        <button class="btn" id="fileBtn" type="button">Fayl tanlash</button>
        <input type="file" id="file" accept=".csv,.txt,text/csv" hidden>
      </div>
      <p class="err" id="err" role="alert"></p>
      <p class="hint">Birinchi qator — sarlavha. Har bir satr yangi qatorda, qiymatlar vergul bilan ajratiladi. Vergul bor matn "qo'shtirnoq" ichida yoziladi.</p>
    </section>

    <section class="panel" aria-labelledby="t2">
      <h2 id="t2">2. Jadval</h2>
      <div class="tools">
        <label>Nom bo'yicha qidiruv
          <input type="search" id="q" placeholder="Masalan: olma">
        </label>
        <label>Saralash ustuni
          <select id="sortCol"></select>
        </label>
        <label>Tartib
          <select id="sortDir">
            <option value="asc">O'sish (kichikdan kattaga)</option>
            <option value="desc">Kamayish (kattadan kichikka)</option>
          </select>
        </label>
      </div>
      <div class="stats" id="stats"></div>
      <div class="scroll"><table id="tbl"></table></div>
    </section>
  </div>
</div>

<script>
(function(){
  var $ = function(id){return document.getElementById(id)};
  var csvEl=$("csv"), tbl=$("tbl"), q=$("q"), sortCol=$("sortCol"), sortDir=$("sortDir"), err=$("err"), stats=$("stats");
  var header=[], rows=[], numeric=[], nameCol=0;
  var SAMPLE = csvEl.value;

  // CSV ni qatorlarga ajratish (qo'shtirnoqni qo'llab-quvvatlaydi)
  function parse(text){
    text = text.replace(/\r\n?/g,"\n").replace(/^\uFEFF/,"");
    var first = text.split("\n")[0] || "";
    var d = ",";
    if(first.indexOf(",")<0){ if(first.indexOf(";")>=0) d=";"; else if(first.indexOf("\t")>=0) d="\t"; }
    var out=[], row=[], cell="", inQ=false;
    for(var i=0;i<text.length;i++){
      var c=text[i];
      if(inQ){
        if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else inQ=false; }
        else cell+=c;
      } else if(c==='"'){ inQ=true; }
      else if(c===d){ row.push(cell.trim()); cell=""; }
      else if(c==="\n"){ row.push(cell.trim()); out.push(row); row=[]; cell=""; }
      else cell+=c;
    }
    row.push(cell.trim()); out.push(row);
    return out.filter(function(r){return r.some(function(x){return x!==""})});
  }

  function toNum(s){
    if(s==null||s==="") return NaN;
    var t=String(s).replace(/\s/g,"").replace(",",".");
    return /^[-+]?\d*\.?\d+(e[-+]?\d+)?$/i.test(t)? parseFloat(t) : NaN;
  }

  function load(){
    err.textContent="";
    var data = parse(csvEl.value);
    if(data.length<1){ header=[]; rows=[]; numeric=[]; fillSort(); render(); return; }
    header = data[0].map(function(h,i){return h||("Ustun "+(i+1))});
    var n = header.length, bad=0;
    rows = data.slice(1).map(function(r){
      if(r.length!==n) bad++;
      var o=r.slice(0,n); while(o.length<n) o.push(""); return o;
    });
    numeric = header.map(function(_,i){
      var vals=rows.map(function(r){return r[i]}).filter(function(v){return v!==""});
      return vals.length>0 && vals.every(function(v){return !isNaN(toNum(v))});
    });
    var ni = header.findIndex(function(h){return /^(nom|name|ism)$/i.test(h)});
    nameCol = ni>=0? ni : 0;
    if(bad) err.textContent = bad+" ta satrda ustunlar soni sarlavhadan farq qiladi — bo'sh joylar to'ldirildi.";
    fillSort(); render();
  }

  function fillSort(){
    var prev = sortCol.value;
    sortCol.innerHTML="";
    var none=document.createElement("option"); none.value="-1"; none.textContent="Saralanmagan"; sortCol.appendChild(none);
    header.forEach(function(h,i){
      var o=document.createElement("option"); o.value=i; o.textContent=h+(numeric[i]?" (son)":""); sortCol.appendChild(o);
    });
    var def = numeric.indexOf(true);
    if(prev!=="" && +prev<header.length && prev!=="-1") sortCol.value=prev;
    else sortCol.value = def>=0 ? String(def) : "-1";
  }

  function highlight(td, text, term){
    td.textContent="";
    if(!term){ td.textContent=text; return; }
    var low=text.toLowerCase(), t=term.toLowerCase(), i=0, j;
    while((j=low.indexOf(t,i))>=0){
      td.appendChild(document.createTextNode(text.slice(i,j)));
      var m=document.createElement("mark"); m.textContent=text.slice(j,j+t.length); td.appendChild(m);
      i=j+t.length;
    }
    td.appendChild(document.createTextNode(text.slice(i)));
  }

  function render(){
    tbl.innerHTML=""; stats.innerHTML="";
    if(!header.length){ tbl.innerHTML='<tbody><tr><td class="empty">CSV matnini chap tomondagi maydonga kiriting.</td></tr></tbody>'; return; }
    var term=q.value.trim();
    var col=+sortCol.value, dir=sortDir.value==="desc"?-1:1;
    var list=rows.filter(function(r){return !term || r[nameCol].toLowerCase().indexOf(term.toLowerCase())>=0});
    if(col>=0){
      var isN=numeric[col];
      list=list.slice().sort(function(a,b){
        var x=a[col], y=b[col];
        if(isN){
          var nx=toNum(x), ny=toNum(y);
          if(isNaN(nx)&&isNaN(ny)) return 0;
          if(isNaN(nx)) return 1; if(isNaN(ny)) return -1;
          return (nx-ny)*dir;
        }
        return x.localeCompare(y,"uz",{sensitivity:"base",numeric:true})*dir;
      });
    }
    // sarlavha
    var thead=document.createElement("thead"), tr=document.createElement("tr");
    header.forEach(function(h,i){
      var th=document.createElement("th"); if(i===col) th.className="sorted";
      th.setAttribute("aria-sort", i===col ? (dir===1?"ascending":"descending") : "none");
      var b=document.createElement("button"); b.type="button"; b.title="Shu ustun bo'yicha saralash";
      var s=document.createElement("span"); s.textContent=h;
      var a=document.createElement("span"); a.className="arrow"; a.textContent = i===col ? (dir===1?"▲":"▼") : "";
      b.appendChild(s); b.appendChild(a);
      b.onclick=function(){
        if(+sortCol.value===i) sortDir.value = sortDir.value==="asc"?"desc":"asc";
        else { sortCol.value=String(i); sortDir.value="asc"; }
        render();
      };
      th.appendChild(b); tr.appendChild(th);
    });
    thead.appendChild(tr); tbl.appendChild(thead);
    // tana
    var tb=document.createElement("tbody");
    if(!list.length){
      var r0=document.createElement("tr"), c0=document.createElement("td");
      c0.colSpan=header.length; c0.className="empty"; c0.textContent='"'+term+'" bo\'yicha hech narsa topilmadi.';
      r0.appendChild(c0); tb.appendChild(r0);
    }
    list.forEach(function(r){
      var tr=document.createElement("tr");
      r.forEach(function(v,i){
        var td=document.createElement("td");
        if(numeric[i]) td.className="num";
        if(i===col) td.className+=" sorted";
        if(i===nameCol) highlight(td,v,term); else td.textContent=v;
        tr.appendChild(td);
      });
      tb.appendChild(tr);
    });
    tbl.appendChild(tb);
    // statistika
    var s='<span><b>'+list.length+'</b> / '+rows.length+' ta qator</span>';
    var ni=numeric.indexOf(true);
    if(ni>=0){
      var sum=list.reduce(function(a,r){var n=toNum(r[ni]);return a+(isNaN(n)?0:n)},0);
      s+='<span>'+header[ni].replace(/</g,"&lt;")+' yig\'indisi: <b>'+(Math.round(sum*100)/100).toLocaleString("ru-RU")+'</b></span>';
    }
    stats.innerHTML=s;
  }

  $("go").onclick=load;
  csvEl.addEventListener("input",load);
  q.addEventListener("input",render);
  sortCol.addEventListener("change",render);
  sortDir.addEventListener("change",render);
  $("sample").onclick=function(){csvEl.value=SAMPLE;q.value="";load();};
  $("clear").onclick=function(){csvEl.value="";q.value="";load();csvEl.focus();};
  $("fileBtn").onclick=function(){$("file").click()};
  $("file").onchange=function(e){
    var f=e.target.files[0]; if(!f) return;
    var rd=new FileReader(); rd.onload=function(){csvEl.value=rd.result;load();}; rd.readAsText(f);
  };
  $("theme").onclick=function(){
    var root=document.documentElement;
    var dark = root.getAttribute("data-theme")==="dark" || (!root.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
    root.setAttribute("data-theme", dark?"light":"dark");
  };
  load();
})();
</script>
</body>
</html>
